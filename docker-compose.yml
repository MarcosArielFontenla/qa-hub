services:
  postgres:
    image: postgres:17
    container_name: qa-test-case-hub-postgres
    environment:
      POSTGRES_DB: qa_test_case_hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - qa_test_case_hub_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qa_test_case_hub"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  qa_test_case_hub_data:
